<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prompt-chain: Supervisor Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen flex items-center justify-center p-6">

<div class="max-w-3xl w-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col h-[80vh]">

    <!-- Header -->
    <header class="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-cyan-400">Supervisor Agent</h1>
            <p class="text-xs text-slate-500">On-Device AI via Prompt API & Web Workers</p>
        </div>
        <div class="flex items-center gap-2">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.6)] animate-pulse"></span>
            <span id="status-text" class="text-sm text-slate-400 font-mono">Initializing Model...</span>
        </div>
    </header>

    <!-- Output Log (Agent Thoughts & Actions) -->
    <main id="log-container" class="flex-1 overflow-y-auto p-6 space-y-4 font-mono text-sm bg-slate-900/50">
        <div class="text-slate-500 italic">System: Waiting for user prompt...</div>
    </main>

    <!-- Input Area -->
    <footer class="bg-slate-950 p-4 border-t border-slate-800">
        <form id="chat-form" class="flex gap-3">
            <input
                    type="text"
                    id="user-input"
                    class="flex-1 bg-slate-800 text-slate-100 placeholder-slate-500 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors disabled:opacity-50"
                    placeholder="e.g., Do I need an umbrella in Seattle today?"
                    disabled
            >
            <button
                    type="submit"
                    id="submit-btn"
                    class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-6 py-3 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled
            >
                Run Agent
            </button>
        </form>
        <div class="text-center mt-3 text-xs text-slate-600">
            Live Demo • @gilfink
        </div>
    </footer>

</div>

<!-- Main Logic -->
<script type="module">
    import { PromptChainHost } from './main.js';

    const dom = {
        statusDot: document.getElementById('status-dot'),
        statusText: document.getElementById('status-text'),
        logContainer: document.getElementById('log-container'),
        form: document.getElementById('chat-form'),
        input: document.getElementById('user-input'),
        btn: document.getElementById('submit-btn')
    };

    // Declare host at the module level so the event listener can access it
    let host;

    function appendLog(role, message) {
        const div = document.createElement('div');
        div.className = 'p-3 rounded-lg border ' + (
            role === 'User' ? 'bg-cyan-950/30 border-cyan-900 text-cyan-200 ml-8' :
                role === 'Agent' ? 'bg-indigo-950/30 border-indigo-900 text-indigo-200 mr-8' :
                    'bg-slate-800/50 border-slate-700 text-slate-300 mr-8' // System/Observation
        );
        div.innerHTML = `<strong class="block mb-1 text-xs opacity-70 uppercase tracking-wider">${role}</strong>${message}`;
        dom.logContainer.appendChild(div);
        dom.logContainer.scrollTop = dom.logContainer.scrollHeight;
    }

    async function initDemo() {
        try {
            // Using LanguageModel as required by the Prompt API implementation
            if (!('LanguageModel' in window)) {
                throw new Error("LanguageModel API not found. Please check Chrome flags.");
            }

            // Initialize the Main Thread Host
            host = new PromptChainHost('./worker.js');

            // Override the host's log behavior to update our UI
            host.onAgentThought = (thought) => appendLog('Agent', `<em>Thought:</em> ${thought}`);
            host.onAgentAction = (action) => appendLog('System', `<em>Executing Tool:</em> ${action}`);
            host.onAgentComplete = (answer) => {
                appendLog('Agent', `<em>Final Answer:</em> ${answer}`);
                dom.input.disabled = false;
                dom.btn.disabled = false;
                dom.btn.textContent = 'Run Agent';
            };

            await host.init("You are a helpful routing supervisor.");

            // Update UI to Ready state
            dom.statusDot.classList.replace('bg-red-500', 'bg-green-500');
            dom.statusDot.classList.replace('shadow-[0_0_10px_rgba(239,68,68,0.6)]', 'shadow-[0_0_10px_rgba(34,197,94,0.6)]');
            dom.statusText.textContent = "Agent Ready";
            dom.input.disabled = false;
            dom.btn.disabled = false;

        } catch (err) {
            dom.statusText.textContent = "Initialization Failed";
            appendLog('System', `<span class="text-red-400">${err.message}</span>`);
        }
    }

    dom.form.addEventListener('submit', (e) => {
        e.preventDefault();
        const prompt = dom.input.value.trim();
        if (!prompt || !host) return;

        appendLog('User', prompt);
        dom.input.value = '';
        dom.input.disabled = true;
        dom.btn.disabled = true;
        dom.btn.textContent = 'Thinking...';

        // Call start directly on our module-scoped host instance
        host.start(prompt);
    });

    // Start initialization
    initDemo();
</script>
</body>
</html>
